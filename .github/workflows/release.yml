name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit versions, push tags, create releases
      pull-requests: write # open the "Version Packages" pull request
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # With changesets: opens or updates the "Version Packages" pull request.
      # After that pull request is merged: tags vX.Y.Z and creates its GitHub Release.
      # The package is private, so nothing is published to npm.
      - name: Create Release Pull Request or Tag the Release
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.CHANGESET_GITHUB_TOKEN || github.token }}
          publish-script: npx changeset publish
          create-github-releases: true

      # Workflows use ezi-flows/webautomate-api/actions/run-build@v1, so v1 follows the latest 1.x release.
      - name: Move the major version tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          version=$(jq -r .version package.json)
          major="v${version%%.*}"
          git fetch --tags --force
          git tag -f "$major" "v${version}^{commit}"
          git push -f origin "refs/tags/${major}"
