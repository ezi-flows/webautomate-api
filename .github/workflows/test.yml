name: Test

on:
  push:
  pull_request:

jobs:
  ci-runner:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test the CI runner
        working-directory: examples/ci
        run: npm test
